<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatExport - 一键导出 AI 对话记录</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #ffffff;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --card-bg: #f9fafb;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--text);
    line-height: 1.6;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
    flex: 1;
  }

  /* Header - 压缩版 */
  header {
    padding: 32px 0 24px;
    text-align: center;
  }

  .logo {
    width: 52px;
    height: 52px;
    background: var(--primary);
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  header h1 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 4px;
    color: #111827;
  }

  header p {
    font-size: 14px;
    color: var(--text-secondary);
    max-width: 460px;
    margin: 0 auto;
  }

  /* Platform Cards */
  .platforms {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin: 24px 0 40px;
  }

  .platform-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    text-align: center;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .platform-card.active:hover {
    border-color: var(--primary);
    box-shadow: 0 8px 24px rgba(79, 70, 229, 0.10);
    transform: translateY(-4px);
  }

  .platform-icon {
    font-size: 40px;
    margin-bottom: 12px;
  }

  .platform-card h3 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .platform-card p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .btn-go {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    padding: 8px 28px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  }

  .btn-go:hover {
    background: var(--primary-hover);
  }

  .badge-coming {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .platform-card.coming-soon {
    opacity: 0.7;
    cursor: default;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: auto;
  }

  footer a {
    color: var(--primary);
    text-decoration: none;
  }

  @media (max-width: 640px) {
    header { padding: 24px 0 16px; }
    header h1 { font-size: 20px; }
    .platform-card { padding: 22px 16px; }
    .platforms { gap: 14px; margin: 16px 0 32px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header - 压缩版 -->
  <header>
    <div class="logo">CE</div>
    <h1>ChatExport</h1>
    <p>一键导出 AI 对话记录，支持多平台、多格式，数据完全本地处理</p>
  </header>

  <!-- Platform Cards -->
  <div class="platforms">

    <!-- DeepSeek - 已上线 -->
    <a href="https://deepseek.chatexport.cn" class="platform-card active" style="text-decoration:none; color:inherit;">
      <div class="platform-icon">🧠</div>
      <h3>DeepSeek</h3>
      <p>支持 Markdown / HTML / JSON / Word / PDF / PNG / TXT / ipynb 八种格式</p>
      <span class="btn-go">立即使用 →</span>
    </a>

    <!-- Kimi - 即将上线 -->
    <div class="platform-card coming-soon">
      <div class="platform-icon">🌙</div>
      <h3>Kimi</h3>
      <p>一键导出 Kimi 对话记录，多格式支持</p>
      <span class="badge-coming">即将上线</span>
    </div>

    <!-- 豆包 - 即将上线 -->
    <div class="platform-card coming-soon">
      <div class="platform-icon">🫘</div>
      <h3>豆包</h3>
      <p>一键导出豆包对话记录，多格式支持</p>
      <span class="badge-coming">即将上线</span>
    </div>

  </div>

</div>

<!-- Footer -->
<footer>
  <div class="container">
    <p>© 2026 <a href="https://chatexport.cn">ChatExport.cn</a> · 让每一段对话都值得保存</p>
  </div>
</footer>

</body>
</html>
